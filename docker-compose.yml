services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guguinha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guguinha}
      POSTGRES_DB: ${POSTGRES_DB:-guguinha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guguinha} -d ${POSTGRES_DB:-guguinha}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mediamtx
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml
      - hls_staging:/staging
    ports:
      - "1935:1935"

  hlsupload:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    entrypoint: ["hlsupload"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-guguinha}:${POSTGRES_PASSWORD:-guguinha}@postgres:5432/${POSTGRES_DB:-guguinha}?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      STAGING_DIR: /staging
    volumes:
      - hls_staging:/staging
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-guguinha}:${POSTGRES_PASSWORD:-guguinha}@postgres:5432/${POSTGRES_DB:-guguinha}?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-noreply@localhost}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      MEDIAMTX_URL: http://mediamtx:9997
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  hls_staging:
