services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guguinha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guguinha}
      POSTGRES_DB: ${POSTGRES_DB:-guguinha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guguinha} -d ${POSTGRES_DB:-guguinha}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml
    ports:
      - "1935:1935"

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-guguinha}:${POSTGRES_PASSWORD:-guguinha}@postgres:5432/${POSTGRES_DB:-guguinha}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
